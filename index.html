<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>LifeSim — An LLM-Powered Life Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { width: 100%; height: 100%; max-width: 480px; margin: 0 auto; }

    /* ── Mobile-friendly range sliders ── */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 44px;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }
    input[type=range]:focus { outline: none; }

    /* Track */
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #333;
    }
    input[type=range]::-moz-range-track {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #333;
    }

    /* Thumb — 44x44 for touch */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #FFD700;
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      margin-top: -20px; /* center on 4px track: (44-4)/2 = 20 */
    }
    input[type=range]::-moz-range-thumb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #FFD700;
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* Firefox focus outline removal */
    input[type=range]::-moz-focus-outer { border: 0; }
  </style>
  <script type="module" crossorigin src="./assets/index-RSv4f-R0.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
